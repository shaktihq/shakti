name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml sqlalchemy[asyncio] alembic aiosqlite PyJWT bcrypt \
                      pypdf pillow psutil pytest pytest-asyncio \
                      anthropic openai
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --ignore=tests/test_workflows.py
        env:
          ANTHROPIC_API_KEY: test-key-not-real

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/
