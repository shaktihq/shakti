site_name: Shakti
site_description: An AI-first, async Python web framework
site_url: https://aditya-bhat.github.io/shakti
repo_url: https://github.com/aditya-bhat/shakti
repo_name: aditya-bhat/shakti
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Your First App: getting-started/first-app.md
  - Core:
    - Routing: core/routing.md
    - Middleware: core/middleware.md
    - Dependency Injection: core/di.md
    - Configuration: core/config.md
    - Request & Response: core/request-response.md
  - ORM:
    - Database: orm/database.md
    - Models: orm/models.md
    - Repository: orm/repository.md
    - Migrations: orm/migrations.md
    - Code Generation: orm/codegen.md
  - Auth:
    - JWT Auth: auth/jwt.md
    - RBAC: auth/rbac.md
    - API Keys: auth/api-keys.md
  - AI:
    - Overview: ai/overview.md
    - Chat & Completion: ai/chat.md
    - Streaming: ai/streaming.md
    - RAG: ai/rag.md
    - Agents: ai/agents.md
    - Prompt Templates: ai/templates.md
  - WebSockets: websockets.md
  - Admin Panel: admin.md
  - Document AI: document-ai.md
  - Workflows: workflows.md
  - Monitoring: monitoring.md
  - CLI Reference: cli.md
  - Deployment: deployment.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
